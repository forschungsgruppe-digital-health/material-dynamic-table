name: dependency-review
# Blocks PRs that add dependencies with known vulnerabilities or disallowed licenses.
# This repo is PUBLIC, so the Dependency Graph is available and the check runs unconditionally.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
